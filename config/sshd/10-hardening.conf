# as1 sshd hardening. Installed to /etc/ssh/sshd_config.d/10-hardening.conf by install-as1.sh (phase 1).
# sshd_config.d files are read in lexical order and the first value wins, so 10- beats 50-cloud-init.conf.
#
# Password login is allowed so a device without a provisioned key can still reach as1.
# Exposure is bounded by ufw (config/ufw.sh): inbound only on tailscale0 and from the LAN /24, never the
# internet. AllowUsers and PermitEmptyPasswords keep the guessable surface to one account with a real password.
PasswordAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 4
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers kyle
ClientAliveInterval 30
ClientAliveCountMax 4
X11Forwarding no
