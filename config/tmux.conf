# as1 tmux config. ~/.tmux.conf is a symlink to this file (install-as1.sh).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,wezterm:clipboard"
set -s set-clipboard on            # pass OSC 52 to the outer terminal (WezTerm writes the Mac clipboard)
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -ga update-environment " SSH_CLIENT SSH_TTY"   # SSH_CONNECTION is already in the default list
set -g focus-events on
set -g escape-time 10
# Session convention: one session per repo (tmux new -As <repo>), "agents" for unattended jobs.
