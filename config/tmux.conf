# Host tmux config. ~/.tmux.conf is a symlink to this file (install-host.sh).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,wezterm:clipboard"
set -s set-clipboard on            # pass OSC 52 to the outer terminal (WezTerm writes the Mac clipboard)
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -ga update-environment " SSH_CLIENT SSH_TTY"   # SSH_CONNECTION is already in the default list
set -g focus-events on
set -g escape-time 10

# Sessions are created and chosen by bin/agent, not by hand: one harness run in one repo is one base session, and
# each device attaches its own view of it (docs/session-picker-plan.md says why). Prefix-g: jump to another session
# without detaching. The picker draws no frame of its own inside tmux, so the popup's rounded border, with the host
# in its title, is the frame; a client under 100 columns (a phone) gets the whole screen, anything wider a window in
# the middle of it.
set -g popup-border-lines rounded
set -g popup-border-style "fg=colour240"
bind g if-shell -F '#{<:#{client_width},100}' \
  "display-popup -E -T ' agent · #h ' -w 100% -h 100% 'agent pick --switch'" \
  "display-popup -E -T ' agent · #h ' -w 80% -h 70% 'agent pick --switch'"
bind c new-window -c '#{pane_current_path}'                   # a second window starts where the first one is
# Which session this is, and which harness it runs, since one device may have several views open.
set -g status-left "[#S#{?#{@harness}, #{@harness},}] "
set -g status-left-length 40
