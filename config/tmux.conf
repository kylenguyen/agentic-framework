# Host tmux config. ~/.tmux.conf is a symlink to this file (install-host.sh).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:clipboard,wezterm:clipboard"
set -s set-clipboard on            # pass OSC 52 to the outer terminal (WezTerm writes the Mac clipboard)
set -g allow-passthrough on
set -g mouse on
set -g history-limit 100000
set -ga update-environment " SSH_CLIENT SSH_TTY"   # SSH_CONNECTION is already in the default list
set -g focus-events on
set -g escape-time 10

# Sessions are created and chosen by bin/agent, not by hand: one harness run in one repo is one base
# session, and each device attaches its own view of it. See `agent pick`, which is where every
# interactive login lands, and docs/session-picker-plan.md for why views instead of a shared attach.
bind g display-popup -E -w 80% -h 70% 'agent pick --switch'   # jump to another session without detaching
bind c new-window -c '#{pane_current_path}'                   # a second window starts where the first one is
# Which session this is, and which harness it runs, since one device may have several views open.
set -g status-left "[#S#{?#{@harness}, #{@harness},}] "
set -g status-left-length 40
