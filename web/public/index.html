<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Agents</title>
<!-- web/public/index.html: the dashboard page (docs/web-dashboard-plan.md T6). Two views switched by the hash
     route in app.mjs: #/ (session list) and #/s/<name> (terminal). No inline style or script, ever: the CSP
     (default-src 'self') refuses both. Later tasks add markup in their own marked sections at the end of
     <body>, or fill the elements marked data-slot from app.mjs. -->
<!-- --- phone --- installable app: manifest, home-screen icon, standalone on iOS -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agents">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.mjs"></script>
</head>
<body>

<section id="view-list" class="view list-view" hidden>
  <header class="bar list-bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7l5 5-5 5M12 17h7"/></svg>
      <h1>Agents</h1>
      <span id="count" class="count"></span>
    </div>
    <span class="spacer"></span>
    <div id="header-actions" class="bar-actions" data-slot="header-actions"></div>
    <button type="button" id="new-btn" class="btn primary">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New session
    </button>
  </header>
  <main class="list-main">
    <div id="list-notice" class="notice" role="status" hidden></div>
    <ul id="sessions" class="sessions" aria-label="Sessions"></ul>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>
      <h2>No sessions</h2>
      <p>Start a harness in one of your repos. It keeps running when you close this tab.</p>
      <button type="button" id="empty-new" class="btn primary">New session</button>
    </div>
    <div id="list-panels" class="panels" data-slot="list-panels"></div>
  </main>
</section>

<section id="view-term" class="view term-view" hidden>
  <header class="bar term-bar">
    <a href="#/" id="back" class="btn ghost icon" aria-label="Back to sessions" title="Back to sessions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span id="term-dot" class="dot"></span>
    <h1 id="term-name" class="term-name"></h1>
    <span id="term-state" class="pill"></span>
    <span class="spacer"></span>
    <div id="term-actions" class="bar-actions" data-slot="term-actions"></div>
    <button type="button" id="term-kill" class="btn danger-ghost">Kill</button>
  </header>
  <div id="banner" class="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-retry" class="btn small">Reconnect</button>
    <a href="#/" id="banner-back" class="btn small ghost">Back to sessions</a>
  </div>
  <div class="term-wrap"><div id="term" class="term"></div></div>
  <div id="term-footer" class="term-footer" data-slot="term-footer"></div>
</section>

<dialog id="new-dialog" class="dialog">
  <form id="new-form" method="dialog">
    <h2>New session</h2>
    <label>Repository
      <select id="new-repo" name="repo" required></select>
    </label>
    <label>Harness
      <select id="new-harness" name="harness">
        <option value="claude" selected>Claude Code</option>
        <option value="codex">Codex</option>
        <option value="omp">Oh My Pi</option>
        <option value="opencode">OpenCode</option>
        <option value="shell">Shell</option>
      </select>
    </label>
    <label>Worktree slug <span class="hint">optional; makes branch agent/&lt;slug&gt; in its own worktree</span>
      <input id="new-slug" name="slug" autocomplete="off" autocapitalize="none" spellcheck="false"
             pattern="[a-z0-9][a-z0-9\-]{0,40}" placeholder="e.g. fix-login" maxlength="41">
    </label>
    <p id="new-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" id="new-create" class="btn primary">Create</button>
    </div>
  </form>
</dialog>

<dialog id="kill-dialog" class="dialog">
  <form method="dialog">
    <h2>Kill <span id="kill-name" class="mono"></span>?</h2>
    <p id="kill-text" class="muted"></p>
    <ul id="kill-files" class="files" hidden></ul>
    <p id="kill-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="button" id="kill-keep" class="btn" hidden>Kill, keep worktree</button>
      <button type="button" id="kill-force" class="btn danger" hidden>Kill and discard changes</button>
      <button type="button" id="kill-go" class="btn danger" hidden>Kill</button>
    </div>
  </form>
</dialog>

<!-- --- paste --- -->
<!-- T8: status of an upload from a paste, a drop or the paperclip (app.mjs, the paste section). -->
<div id="paste-toast" class="paste-toast" role="status" aria-live="polite" hidden></div>

<!-- --- phone --- -->
<!-- The bar under the terminal on a narrow screen; app.mjs puts a copy in the term-footer slot below 700 px. -->
<template id="phone-footer">
  <form class="phone-line" hidden>
    <input class="phone-line-input" type="text" enterkeyhint="send" autocomplete="off" autocapitalize="none"
           autocorrect="off" spellcheck="false" aria-label="Line to send" placeholder="Type a line, Enter sends it">
    <button type="submit" class="btn small primary">Send</button>
  </form>
  <div class="phone-keys" role="toolbar" aria-label="Terminal keys">
    <div class="phone-scroll">
      <button type="button" class="key" data-key="esc">Esc</button>
      <button type="button" class="key" data-key="tab">Tab</button>
      <button type="button" class="key mod" data-key="ctrl" aria-pressed="false">Ctrl</button>
      <button type="button" class="key" data-key="up" aria-label="Up">↑</button>
      <button type="button" class="key" data-key="down" aria-label="Down">↓</button>
      <button type="button" class="key" data-key="left" aria-label="Left">←</button>
      <button type="button" class="key" data-key="right" aria-label="Right">→</button>
      <button type="button" class="key" data-key="|">|</button>
      <button type="button" class="key" data-key="/">/</button>
      <button type="button" class="key" data-key="~">~</button>
      <button type="button" class="key" data-key="ctrl-c" aria-label="Control C">^C</button>
      <button type="button" class="key" data-key="ctrl-b" aria-label="Control B">^B</button>
      <button type="button" class="key font" data-key="font-down" aria-label="Smaller text">A−</button>
      <button type="button" class="key font" data-key="font-up" aria-label="Larger text">A+</button>
    </div>
    <button type="button" class="key line-toggle" data-key="line" aria-pressed="false" aria-label="Line input">Line</button>
  </div>
</template>

</body>
</html>
