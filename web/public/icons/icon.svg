<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<!-- web/public/icons/icon.svg: the home-screen icon (docs/web-dashboard-plan.md T7), the page's prompt logo on
     the terminal colour. Full bleed with the mark inside the central 60%, so it also serves as a maskable icon.
     icon-192.png and icon-512.png are rendered from it by Chromium in the e2e image, from the repo root (the quotes
     in -''-rm only keep two hyphens out of this XML comment):
     docker run -''-rm -u "$(id -u)" -e HOME=/tmp -v "$PWD/web/public/icons:/icons" -w /opt/web af-e2e-web node -e "const {chromium}=require('@playwright/test');(async()=>{const b=await chromium.launch();for(const s of [192,512]){const p=await b.newPage({viewport:{width:s,height:s}});await p.goto('file:///icons/icon.svg');await p.screenshot({path:'/icons/icon-'+s+'.png'});}await b.close();})()"
-->
<rect width="512" height="512" fill="#0d1117"/>
<g fill="none" stroke="#e6edf3" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
<path d="M156 176l84 80-84 80"/>
<path d="M268 336h96" stroke="#4d8dff"/>
</g>
</svg>
